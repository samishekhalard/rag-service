name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest
      # Write to a scratch directory, NOT results/. The committed runs are
      # measurements from a specific machine, and the README quotes their
      # latencies; regenerating them on a CI runner overwrites those figures
      # with this runner's hardware and makes the README's own numbers
      # untraceable. This step proves the harness runs; it is not a new
      # measurement.
      - name: Offline evaluation runs end to end
        run: python -m eval.run --variants fake,fake-norerank --out-dir "$RUNNER_TEMP/eval"

      - name: Committed results are unchanged
        run: git diff --exit-code results/
      - name: README numbers must trace to a recorded run
        run: python scripts/check_readme_numbers.py
