services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image is distroless — no curl, no wget. Bash's /dev/tcp
      # is not available either, so the check uses Qdrant's own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Langfuse needs its own Postgres; both are optional. Without keys in .env
  # the service still runs and still collects traces locally.
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-env}
      SALT: ${LANGFUSE_SALT:-change-me-in-env}
      TELEMETRY_ENABLED: "false"

  # Pull a model once the stack is up:
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:0.5.4
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles: ["local"]

  api:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LANGFUSE_HOST: http://langfuse:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results

volumes:
  qdrant_storage:
  langfuse_db:
  ollama_models:
